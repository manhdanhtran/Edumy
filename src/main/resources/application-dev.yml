    locations: classpath:db/migration,classpath:db/seed   # dev seed V1000+ (docs/ai/06)
  mail:
    host: localhost
    port: 1025   # Mailpit from compose.yaml, UI http://localhost:8025

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith,caches,metrics   # caches/metrics: Caffeine stats (docs/ai/05 §5.3)

springdoc:
