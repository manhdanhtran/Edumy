# Vietnamese Bean Validation texts (docs/ai/05 §5.2 "Validation messages"). UTF-8. Default bundle (no _vi suffix), so
# it applies whatever the request locale is. Only the keys used so far: the jakarta.* keys override the English
# defaults of Hibernate Validator; the edumy.* keys are explicit messages ({key} in the annotation).
jakarta.validation.constraints.NotBlank.message=Không được để trống
jakarta.validation.constraints.Email.message=Email không đúng định dạng
jakarta.validation.constraints.Size.message=Độ dài phải từ {min} đến {max} ký tự

edumy.password.policy=Mật khẩu phải dài 8–72 ký tự, có ít nhất một chữ cái và một chữ số
edumy.password.too-many-bytes=Mật khẩu quá dài: tối đa 72 byte (chữ có dấu chiếm 2–3 byte), hãy dùng mật khẩu ngắn hơn
edumy.user.full-name.size=Họ tên tối đa 100 ký tự
