# Datasource comes from Testcontainers @ServiceConnection (test/support/TestcontainersConfiguration).
spring:
  datasource:
    hikari:
      minimum-idle: 2   # P13 (DT-m5): ~10 cached contexts keep few idle connections; max stays 10 (race tests use 8)
  flyway:
    locations: classpath:db/migration   # no dev seed in tests

edumy:
  scheduler:
    enabled: false   # tests call the services directly (P11-e); SchedulerBeansTest covers the switch
  security:
    auth-rate-limit:   # one IP runs the whole suite; the limiter is tested with explicit values (P13)
      register-capacity: 100000
      forgot-capacity: 100000
      reset-capacity: 100000
    jwt:
      secret: bSLDLXBtujvgr0zpYoZNZGbn9pMzRaa4W358RrPR83M=   # TEST ONLY
  payment:
    webhook-secret: test-only-fake-payment-webhook-secret   # TEST ONLY
