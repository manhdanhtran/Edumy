spring:
  application:
    name: edumy-backend
  datasource:
    # DATETIME(6) has no time zone: force UTC end to end (docs/ai/03 §3.1).
    url: jdbc:mysql://localhost:3306/edumy?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: edumy
    password: ${MYSQL_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  cache:
    type: caffeine   # per-cache specs in shared.config.CacheConfig (docs/ai/05 §5.3)

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"   # traceId from shared.web.TraceIdFilter (= X-Trace-Id = ProblemDetail traceId)

management:
  endpoints:
    web:
      exposure:
        include: health,info   # docs/ai/04 §4.5 — nothing else public

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

edumy:
  security:
    jwt:
      access-ttl: 15m
      refresh-ttl: 14d
      secret: ${EDUMY_JWT_SECRET:}
  cors:
    allowed-origins: []
  scheduler:
    enabled: false   # phase 1: all schedulers are stubs (ADR-005)
  payment:
    provider: fake
  frontend:
    base-url: ${EDUMY_FRONTEND_BASE_URL:http://localhost:5173}   # SPA origin for links in emails (Q5)
  mail:
    from: ${EDUMY_MAIL_FROM:no-reply@edumy.local}
