spring:
  application:
    name: edumy-backend
  datasource:
    # DATETIME(6) has no time zone: force UTC end to end (docs/ai/03 §3.1).
    url: jdbc:mysql://localhost:3306/edumy?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: edumy
    password: ${MYSQL_PASSWORD:}
    hikari:
      # ADR-010 (P10 DT-B1): READ COMMITTED for every transaction. Writes lock a row (course, enrollment, user …)
      # and then read related rows; under MySQL's default REPEATABLE READ those reads came from the snapshot taken by
      # the first plain read of the transaction (before the lock wait), so a writer could overwrite a change
      # committed while it waited (lost update).
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  cache:
    type: caffeine   # per-cache specs in shared.config.CacheConfig (docs/ai/05 §5.3)

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"   # traceId from shared.web.TraceIdFilter (= X-Trace-Id = ProblemDetail traceId)

management:
  endpoints:
    web:
      exposure:
        include: health,info   # docs/ai/04 §4.5 — nothing else public

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

edumy:
  security:
    jwt:
      access-ttl: 15m
      refresh-ttl: 14d
      secret: ${EDUMY_JWT_SECRET:}
  cors:
    allowed-origins: []
  scheduler:
    enabled: true    # P11-e (NFR-09): QR expiry, 24 h order expiry, code cleanup; false in application-test.yml
    interval: PT5M
    initial-delay: PT1M
  payment:
    provider: fake
  frontend:
    base-url: ${EDUMY_FRONTEND_BASE_URL:http://localhost:5173}   # SPA origin for links in emails (Q5)
  mail:
    from: ${EDUMY_MAIL_FROM:no-reply@edumy.test}
